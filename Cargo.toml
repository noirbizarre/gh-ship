# gh-ship — The GitHub Release Orchestrator — a gh CLI extension that orchestrates Release PRs and GitHub Actions release workflows
#
# Single crate, library + binary. The library (`src/lib.rs`) holds the engine;
# the binary (`src/main.rs`) is a thin CLI over it, so integration tests can
# exercise either. Cargo discovers both targets on its own.

[package]
name = "gh-ship"
version = "0.6.1"
edition = "2024"
# The MSRV. Checked by the MSRV job in ci.yaml, which greps this very line — keep it
# a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.88"
license = "MIT"
# No `authors`: Cargo/crates.io stopped generating and reading it after the
# 2021 edition — ownership on crates.io comes from the registry account that
# published, not this field. `author` still feeds LICENSE and, when `aur` is
# on, the PKGBUILD's `# Maintainer:` line.
description = "The GitHub Release Orchestrator — a gh CLI extension that orchestrates Release PRs and GitHub Actions release workflows"
repository = "https://github.com/noirbizarre/gh-ship"
homepage = "https://noirbizarre.github.io/gh-ship/"
documentation = "https://noirbizarre.github.io/gh-ship/"
readme = "README.md"
keywords = ["github", "release", "gh-extension", "cli", "release-automation"]
categories = ["command-line-utilities", "development-tools"]
# Not published to crates.io. Distribution is through the release assets alone,
# and `cargo install gh-ship` would create a second install path that
# nothing tests and nobody updates.
publish = false
# The integration-test helper is also a binary; unqualified `cargo run` must
# continue to select the extension rather than require a target choice.
default-run = "gh-ship"

# cargo-binstall otherwise derives an asset name from the target triple, and
# the publish workflow's assets carry short platform suffixes instead (the
# `asset` field of each entry in `data/targets.toml`). A wrong guess is not an
# error: binstall silently falls back to compiling from source, which is the
# slow path this exists to avoid. So every target the publish workflow builds
# is mapped by hand, from that same catalogue — one override per selected
# target, so this list never drifts from the publish matrix.
#
# `pkg-fmt = "bin"`: the publish workflow uploads the raw executable, not an
# archive — see publish-release.yaml's "Stage the asset" step.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/gh-ship_{ version }_linux-amd64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/gh-ship_{ version }_linux-arm64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/gh-ship_{ version }_linux-amd64-musl"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/gh-ship_{ version }_darwin-amd64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/gh-ship_{ version }_darwin-arm64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/gh-ship_{ version }_windows-amd64.exe"

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
#
# Cargo only reads [profile.*] from a workspace's root manifest, so this stays
# unconditional: member crates inherit it whether or not this file also
# defines a [package].
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds what follows once, at `git tpl init`, and then leaves it
# alone: Dependabot bumps versions here weekly, and a template that propagated
# its own would open a conflict against every one of those PRs. Resolve in
# favour of the project if `git tpl update` ever touches it.

[dependencies]
base64 = "0.23"
boon = "0.6"
clap = { version = "4", features = ["derive", "env"] }
demand = "2"
miette = { version = "7", features = ["fancy"] }
# `custom_syntax` is what lets the workflow templates keep GitHub Actions'
# `${{ }}` verbatim: see the delimiter note in src/templates.rs.
minijinja = { version = "2", features = ["loader", "custom_syntax"] }
owo-colors = "4"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
sha2 = { version = "0.11", features = ["oid"] }
strsim = "0.11"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
boon = "0.6"
insta = { version = "1", features = ["filters", "json"] }
predicates = "3"
serde_json = "1"
serde_norway = "0.9"
tempfile = "3"

[[bin]]
name = "gh-ship"
path = "src/main.rs"

# Native integration-test executable; release packaging stages only gh-ship.
[[bin]]
name = "gh-ship-test-gh"
path = "tests/support/gh_stub.rs"
test = false
doc = false

[lib]
name = "gh_ship"
path = "src/lib.rs"
