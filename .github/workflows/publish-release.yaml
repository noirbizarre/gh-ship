
name: 📦 Publish Release

# Dispatched by `gh ship release` on the tag it just created — naming the run
# after it tells the two apart in the Actions run list, where "Publish
# Release" alone would not.
run-name: 📦 Publish Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag being released
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string

# The upload authenticates as a GitHub App and carries its own permissions.
# These cover `actions/checkout` alone, which only reads.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Retries against a flaky registry/network rather than failing a release
  # build outright, and no incremental cache — this is a one-shot build, so
  # there is nothing later to reuse it.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Same bar CI's clippy job already holds the code to; a release binary
  # should not ship a warning CI would have failed on for anyone else.
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: 🏗️ ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `ext` is emitted on every leg, empty where it does not apply. Omitting
        # it on the non-Windows ones would make `${{ matrix.ext }}` reference a
        # property that is not in the matrix type whenever no Windows target is
        # selected — an actionlint error, not a runtime one, so it would only
        # surface in the consuming project's CI.
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, asset: linux-amd64, cross: true, ext: "" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, asset: linux-arm64, cross: true, ext: "" }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, asset: linux-amd64-musl, cross: true, ext: "" }
          - { target: x86_64-apple-darwin, runner: macos-latest, asset: darwin-amd64, cross: false, ext: "" }
          - { target: aarch64-apple-darwin, runner: macos-latest, asset: darwin-arm64, cross: false, ext: "" }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, asset: windows-amd64, cross: false, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly what is being released, not a branch tip that
          # may have moved since.
          ref: ${{ inputs.tag }}
          # The upload authenticates via a separately-installed `gh`; nothing
          # in this job shells out to `git push`.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # `cross` is only needed on the Linux legs, so it is installed
      # conditionally here rather than added to mise.toml, which would pull it
      # onto every runner in the matrix. It also supplies the cross C toolchain
      # that any vendored C dependency needs.
      - uses: taiki-e/install-action@cross
        if: matrix.cross

      # Without this a standalone MSVC binary can fail to start on a machine
      # that lacks the matching Visual C++ Redistributable — exactly the
      # machine a downloaded release binary targets. Static linking trades a
      # few hundred KB for not depending on that being installed.
      - name: Statically link the MSVC C runtime
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Stage the asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gh-ship${{ matrix.ext }}" \
             "dist/gh-ship_${{ inputs.tag }}_${{ matrix.asset }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 🚀 Publish
    needs: build
    runs-on: ubuntu-latest

    # This is the deployment. Declaring a `url:` registers it in the
    # repository's deployment list and links straight to what shipped.
    # The environment is `release` because that is where the release
    # secrets live.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

    steps:
      # An installation token, revoked when this job ends. It cannot live in
      # the job's `env:` — a step output is not resolvable there — so the one
      # `gh` step below sets it itself.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          # The upload below authenticates with the App token, not a
          # persisted checkout credential.
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        # `--` so an asset whose name begins with a dash is treated as a
        # file rather than an option (shellcheck SC2035).
        run: sha256sum -- * > SHA256SUMS

      # The release already exists as a DRAFT: gh-ship created it before
      # dispatching this workflow, and will undraft it once we succeed.
      # That ordering is what lets assets land before anyone is notified.
      - name: Upload assets to the draft release
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
