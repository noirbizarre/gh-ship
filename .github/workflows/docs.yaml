name: 📚 Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - schemas/**
      - zensical.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv is pinned by mise.lock, so the docs build uses the same version
      # as `mise run docs:build` locally.
      - uses: jdx/mise-action@v4
        with:
          # Keep in sync with PINNED_MISE_VERSION in ci.yaml.
          version: 2026.7.18
          cache: true

      - name: Build the site
        run: mise run docs:build

      # The JSON Schema is a published contract: users reference it by URL
      # from every artifact they produce, and editors fetch it for
      # completion. Serving it from the docs site keeps the URL in
      # `$id` honest.
      - name: Publish the JSON Schemas
        run: |
          mkdir -p site/schema/release site/schema/config
          cp schemas/release.v1.schema.json site/schema/release/v1.json
          cp schemas/config.v1.schema.json  site/schema/config/v1.json

      - name: Verify the schemas are reachable at their advertised URLs
        run: |
          # Each `$id` must match where we just published it, or every
          # `$schema` reference in the wild breaks.
          test -f site/schema/release/v1.json
          grep -q 'https://noirbizarre.github.io/gh-ship/schema/release/v1.json' \
            site/schema/release/v1.json

          test -f site/schema/config/v1.json
          grep -q 'https://noirbizarre.github.io/gh-ship/schema/config/v1.json' \
            site/schema/config/v1.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
