name: ♻️ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The channel comes from the action ref, not rust-toolchain.toml,
      # and each job installs the components it needs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Tool versions come from mise.toml + mise.lock, so CI runs exactly
      # what `mise run default` runs locally.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure

  test:
    name: 🧪 Tests (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # nextest and llvm-cov are pinned by mise.lock rather than resolved
      # per-run, so a tool release cannot change CI behaviour on its own.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov nextest --profile ci
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          report_type: test_results

  # The artifact schema is a published contract. Anything that changes it
  # must keep the documented examples and the fixture corpus valid, and
  # must keep the embedded copy identical to the published one.
  protocol:
    name: 📜 Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      - name: Validate the artifact corpus
        run: mise run schema

      - name: Ensure `validate` needs no network, repo or auth
        run: |
          cargo build
          mkdir -p "$RUNNER_TEMP/isolated"
          cd "$RUNNER_TEMP/isolated"
          echo '{"schemaVersion":1,"changed":false}' > ship.release.json
          env -i "$GITHUB_WORKSPACE/target/debug/gh-ship" validate ship.release.json

      # gh-ship releases gh-ship. Its own configuration and workflows must
      # satisfy the contract it enforces on everyone else.
      - name: Dogfood — validate our own setup
        run: ./target/debug/gh-ship validate
