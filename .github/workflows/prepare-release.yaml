name: 🚀 Prepare Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Produce the artifact but do not commit or push
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

# The push authenticates as a GitHub App, whose installation permissions apply
# instead of these. These cover the checkout, which only reads.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    # APP_CLIENT_ID and APP_PRIVATE_KEY live only in the `release` environment,
    # and an environment variable resolves only in a job that declares one —
    # which is why this key is load-bearing for authentication, not just gating.
    # Preparing a release is not a deployment, so this gates secrets and reviews without registering one.
    # The deployment is publish-release.
    environment:
      name: release
      deployment: false

    steps:
      # The push below must trigger CI on the release branch, which the default
      # GITHUB_TOKEN cannot do. An App installation token can, and is revoked
      # when this job ends.
      # See https://noirbizarre.github.io/gh-ship/workflows/#using-a-github-app
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The numeric id of the App's bot user, which is what makes the release
      # commit attribute to the App rather than to github-actions[bot].
      - name: Get the App's user id
        id: bot
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          # Full history *and* tags: git-cliff derives the next version from
          # the last tag, and a shallow clone has neither.
          fetch-depth: 0
          fetch-tags: true
          # The default GITHUB_TOKEN cannot trigger workflows, so a Release PR
          # it authors would show no CI results.
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # git-cliff is pinned by mise.lock: a changelog tool that changes
      # version between releases would silently change our release notes.
      - uses: jdx/mise-action@v4
        with:
          # Keep in sync with PINNED_MISE_VERSION in ci.yaml.
          version: 2026.7.18
          cache: true

      # --- versioning: ours, not gh-ship's ---------------------------------

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail

          # Compare against the last *tag*, not the version in Cargo.toml.
          # Cargo.toml already carries the version being prepared, so
          # comparing to it would report "no change" for the very first
          # release and make bootstrapping impossible.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next_tag="$(git cliff --bumped-version)"

          # This project tags without a `v` prefix, so the tag and the version
          # are the same string. They stay separate outputs because the release
          # artifact keeps them separate: the tag convention is a project's own
          # choice, and gh-ship never derives one from the other.
          {
            echo "tag=$next_tag"
            echo "version=$next_tag"
          } >> "$GITHUB_OUTPUT"

          if [ "$last_tag" = "$next_tag" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new releasable commits since ${last_tag:-the beginning}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${last_tag:-<nothing>} -> $next_tag"
          fi
        env:
          # git-cliff use the github integration
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Generate the changelog
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git cliff --bump -o CHANGELOG.md

          # Release notes are scratch input for `jq --rawfile`, not a
          # source file. Keep them out of the worktree so `git add -A`
          # cannot commit them.
          git cliff --unreleased --bump --strip all -o "$RUNNER_TEMP/ship-notes.md"

          # The `## <version> - <date>` heading belongs to CHANGELOG.md. The
          # Release PR and the GitHub Release both carry the version in their
          # own title, so drop the first heading and the blank lines ahead of
          # it. The `0,/^## /` range stops at the first match, leaving later
          # `##` sections such as New Contributors alone.
          sed -i -e '0,/^## /{/^## /d}' -e '/./,$!d' "$RUNNER_TEMP/ship-notes.md"
        env:
          # git-cliff use the github integration
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Apply the version
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Only the first `version =` belongs to [package].
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          cargo update --workspace

      - name: Commit and push
        if: steps.version.outputs.changed == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name  '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.bot.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

          # Self-healing: an earlier revision of this workflow committed
          # NOTES.md to the release branch. Drop it if it is still tracked.
          git rm --cached --ignore-unmatch NOTES.md >/dev/null

          git add -A
          git diff --cached --quiet || \
            git commit -m "chore(release): ${{ steps.version.outputs.version }}"
          git push origin HEAD

      # --- the protocol ------------------------------------------------------

      - name: Write the release artifact
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.changed }}" != "true" ]; then
            jq -n '{schemaVersion: 1, changed: false}' > ship.release.json
          else
            jq -n \
              --arg version "${{ steps.version.outputs.version }}" \
              --arg tag     "${{ steps.version.outputs.tag }}" \
              --rawfile notes "$RUNNER_TEMP/ship-notes.md" \
              '{
                "$schema": "https://noirbizarre.github.io/gh-ship/schema/release/v1.json",
                schemaVersion: 1,
                changed: true,
                version: $version,
                tag: $tag,
                release: { notes: $notes }
              }' > ship.release.json
          fi
          cat ship.release.json

      # Dogfooding: gh-ship validates its own release artifact using the build
      # from this very commit, so a protocol regression cannot ship.
      - name: Validate the release artifact
        run: |
          cargo build --release
          ./target/release/gh-ship validate ship.release.json

      - uses: actions/upload-artifact@v7
        with:
          name: ship-release
          path: ship.release.json
          if-no-files-found: error
