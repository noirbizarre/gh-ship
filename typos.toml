# typos configuration.
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
  "Cargo.lock",
  "mise.lock",
  # Generated. Its prose is commit subjects, already spell-checked at
  # generation time by cliff.toml's `typos --write-changes -` preprocessor,
  # while the per-commit links embed hex SHAs that read as typos: a short SHA
  # containing "abd" or "ba" would fail CI at release time.
  "CHANGELOG.md",
  # Snapshots contain the deliberate typos below, echoed back in diagnostics.
  "tests/snapshots/**",
  # Fixtures are the invalid-artifact corpus: being wrong is the point.
  "tests/fixtures/**",
  "site/**",
]

[default.extend-words]
# Deliberate typos used to exercise "did you mean?" suggestions and JSON
# syntax-error reporting. Correcting these would silently delete the tests.
relase = "relase"
releas = "releas"
tru = "tru"
# A near-miss for `main`, close enough for the Jaro–Winkler floor, used to
# prove an unmatched release line suggests the branch you meant.
mian = "mian"
