# Toolchain and task definitions.
#
# Tool versions are resolved to exact builds in `mise.lock`, which is
# committed. CI installs from these two files, so local runs and CI runs
# use identical tool versions — CI drives the tools directly rather than
# through the tasks defined below.
#
# Tools no CI job needs are declared on their own task rather than in `[tools]`,
# because `mise install` — what CI runs — installs `[tools]` only. It matters
# here: cargo-binstall has no prebuilt artifact for resvg or cargo-insta, so a
# global entry made every CI job compile both from source.
#
# Rust itself is intentionally not managed here: CI needs per-job components
# (rustfmt, clippy, llvm-tools-preview) and cross-compilation targets, which
# `dtolnay/rust-toolchain` handles better. `rust-toolchain.toml` pins the
# channel for both.

[settings]
# Resolve tools through mise.lock and keep it updated. Without this, the
# lockfile is ignored and `latest` really means latest.
lockfile = true

# Do not let mise adopt `rust-toolchain.toml`. Rust is installed by rustup
# locally and by `dtolnay/rust-toolchain` in CI, which handle per-job
# components and cross-compilation targets that mise does not. Leaving both
# in charge would have mise shadow the toolchain CI just installed.
idiomatic_version_file_enable_tools = []

[tools]
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is
# absent, so without this a local run is NOT the CI run. Runners ship it.
shellcheck = "latest"
prek = "latest"
typos = "latest"
uv = "latest"
git-cliff = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
# cargo-insta and resvg are declared on the tasks that use them instead of
# here — see the note in the header.

# --- Everyday ---------------------------------------------------------------

[tasks.default]
description = "Run fmt, lint, build and test"
depends = ["fmt", "lint", "lint:actions", "build", "test"]

[tasks.build]
description = "Build the binary"
run = "cargo build"

[tasks.test]
description = "Run tests (accepts nextest selectors)"
raw_args = true
run = "cargo nextest run"

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint the code"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# actionlint 1.7.7 does not yet know `environment.deployment`, which is a
# documented, supported key:
# https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
# Suppress that one rule only — every other unexpected key is still caught.
# Drop the -ignore once actionlint ships support.
run = """
actionlint -ignore 'unexpected key "deployment" for "environment" section' .github/workflows/*.yaml
"""

[tasks.snapshots]
description = "Review and update insta snapshots interactively"
tools = { "cargo:cargo-insta" = "latest" }
run = "cargo insta review"

# --- gh-ship itself ---------------------------------------------------------

[tasks.ship]
description = "Run gh-ship from source"
raw_args = true
run = "cargo run --"

[tasks.setup]
description = "Install gh-ship locally"
run = "cargo install --path . --force"

[tasks.schema]
description = "Validate every artifact fixture against the schema"
run = "cargo nextest run --test validate"

[tasks.dogfood]
description = "Validate this repository's own gh-ship setup"
run = "cargo run -- validate"

# --- Documentation ----------------------------------------------------------

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"

[tasks."docs:build"]
description = "Build the documentation"
run = "uvx zensical build"

# --- Artwork ----------------------------------------------------------------
#
# Neither of these joins `default`: they rewrite committed binaries, so a
# routine run would dirty the working tree every time. Run them when the
# artwork changes — both after editing icon.svg, since the social preview
# embeds the logo.

[tasks.icons]
description = "Rasterize docs/images/icon.svg into the PNG sizes"
# resvg is pure Rust, so it needs no system libraries and renders identically on
# every platform.
tools = { "cargo:resvg" = "latest" }
run = """
for size in 128 256 512; do
  resvg --width "$size" --height "$size" docs/images/icon.svg "docs/images/icon-$size.png"
  echo "docs/images/icon-$size.png"
done
"""

[tasks.social]
description = "Render the GitHub social preview image from the logo"
# GitHub has no API for the social preview, so this is generated here and
# uploaded by hand, once, under:
#   Settings -> General -> Social preview
#
# The canvas lives in social-preview.svg rather than being passed as flags:
# resvg scales to fit rather than padding, so --width 1280 --height 640 on a
# 1.8:1 logo yields 1151x640, not GitHub's required 1280x640. The wrapper
# references logo.svg instead of copying it, so the two cannot drift.
tools = { "cargo:resvg" = "latest" }
run = """
resvg docs/images/social-preview.svg docs/images/social-preview.png
echo "docs/images/social-preview.png — upload under Settings > General > Social preview"
"""
